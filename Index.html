<!DOCTYPE html>
<html lang="en">

    <title>Book Heaven</title>
</head>
<body>
<h1>Book Heaven</h1>
<input type="text" id="searchInput" placeholder="Search for the book">
<div id="Genre">

    <button class="type">Historical</button>
    <button class="type">Horror</button>

    <button class="type">Fiction</button>

    </div>
    <button id="orderBtn" onclick="placeOrder()">Place Order</button>
